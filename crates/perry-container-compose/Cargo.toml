[package]
name = "perry-container-compose"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Native Rust reimplementation of container-compose with auto-detection"

[lib]
crate-type = ["rlib"]

[[bin]]
name = "perry-compose"
path = "src/main.rs"

[dependencies]
perry-runtime = { workspace = true, features = ["stdlib"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"
tracing = "0.1"
clap = { version = "4.5", features = ["derive"] }
md5 = "0.7"
regex = "1.10"
which = "6.0"
thiserror = "1.0"
anyhow = "1.0"
indexmap = { version = "2.1", features = ["serde"] }
dialoguer = { version = "0.11", optional = true }
console = { version = "0.15", optional = true }
base64 = "0.22"
rand = "0.8"
futures = "0.3"

[dev-dependencies]
proptest = "1.4"

[features]
default = ["installer"]
installer = ["dep:dialoguer", "dep:console"]
