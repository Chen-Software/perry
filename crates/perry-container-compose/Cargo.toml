[package]
name = "perry-container-compose"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Native Rust reimplementation of container-compose functionality"

[dependencies]
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
serde_yaml = "0.9"
tokio = { workspace = true, features = ["full"] }
async-trait = "0.1"
tracing = "0.1"
clap = { workspace = true, features = ["derive"] }
md-5 = "0.10"
thiserror.workspace = true
anyhow.workspace = true
indexmap = { version = "2.2", features = ["serde"] }
hex = "0.4"
rand = "0.8"
dashmap = "6.0"

# Optional for installer
dialoguer = { workspace = true, optional = true }
console = { workspace = true, optional = true }
tracing-subscriber = "0.3.23"

[dev-dependencies]
proptest = "1.4"

[features]
default = []
installer = ["dep:dialoguer", "dep:console"]

[[test]]
name = "compose_engine_test"
path = "tests/functional/compose_engine_test.rs"
integration = []
testing = []
